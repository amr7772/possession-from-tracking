<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>من يملك الكرة؟ | Who has the ball?</title>
<meta name="description" content="استحواذ مباراة كرة القدم من الفيديو، محسوبًا داخل متصفحك. Football possession from a match video, worked out in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #eef0eb; --text: #121611; --text-2: #4c5449; --text-3: #7b8478;
  --line: rgba(18,22,17,0.10); --line-2: rgba(18,22,17,0.22);
  --accent: #1c7a45; --accent-ink: #ffffff; --accent-soft: rgba(28,122,69,0.09);
  --series-1: #2a78d6; --series-2: #eb6834; --none: #d5d8d0; --danger: #b42318; --warn-bg: rgba(214,153,0,0.13);
  --play: rgba(28,122,69,0.30); --stop: #9aa29b;
  --pitch-bg: #e6ede2; --pitch-line: rgba(18,22,17,0.40); --pitch-view: rgba(255,255,255,0.62); --heat: 29,79,145;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0b0f0c; --surface: #141a15; --surface-2: #1b221c; --text: #ecf0ea; --text-2: #b2bbb0; --text-3: #7d877b;
    --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.18);
    --accent: #34a866; --accent-ink: #04130a; --accent-soft: rgba(52,168,102,0.13);
    --series-1: #3987e5; --series-2: #d95926; --none: #2f3730; --danger: #ff8f85; --warn-bg: rgba(214,153,0,0.16);
    --play: rgba(52,168,102,0.38); --stop: #66706a;
    --pitch-bg: #18221b; --pitch-line: rgba(255,255,255,0.34); --pitch-view: rgba(255,255,255,0.07); --heat: 142,197,255;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); }
.app { max-width: 1120px; margin: 0 auto; padding: 22px 16px 56px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { width: 46px; height: 46px; flex: none; color: var(--text); }
h1 { font-size: 30px; line-height: 1.2; margin: 0; font-weight: 700; }
.tagline { margin: 2px 0 0; color: var(--text-2); font-size: 15px; }
h2 { font-size: 18px; line-height: 1.4; margin: 0 0 4px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
.note { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
.sub2 { color: var(--text-2); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
button { font: inherit; font-size: 15px; font-weight: 500; border-radius: 11px; padding: 9px 16px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--text-3); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; padding: 11px 26px; font-size: 16px; }
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: 0.45; cursor: default; filter: none; }
button:focus-visible, input:focus-visible, select:focus-visible, .scrub:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { font-size: 14px; padding: 6px 14px; border-radius: 999px; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 28px 16px; border: 2px dashed var(--line-2); border-radius: 16px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 42px; height: 42px; color: var(--accent); margin-bottom: 4px; }
.drop strong { font-size: 18px; font-weight: 600; }
.drop .hint { color: var(--text-2); font-size: 14px; }
.file-info { margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 14px; margin-top: 16px; align-items: end; }
@media (max-width: 820px) { .form { grid-template-columns: 1fr; } }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 12px; margin: 0; min-width: 0; }
legend { padding: 0 6px; font-size: 13px; color: var(--text-2); }
.team-row { display: flex; gap: 8px; }
input[type=text], select { font: inherit; font-size: 15px; color: var(--text); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.team-row input { flex: 1; }
.team-row select { width: 128px; flex: none; }
.range { display: flex; gap: 10px; }
.range label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }
.range input { width: 96px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.progress-wrap { margin-top: 16px; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.status-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; margin-top: 8px; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.error { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: rgba(180,35,24,0.09); color: var(--danger); font-size: 14px; }
.privacy { margin: 14px 0 0; font-size: 13px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
.privacy svg { width: 15px; height: 15px; flex: none; }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.side { display: flex; align-items: center; gap: 14px; min-width: 0; }
.side.b { justify-content: flex-end; }
.side .who { min-width: 0; }
.kit { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.6); display: inline-block; }
.kit.sm { width: 12px; height: 12px; vertical-align: -1px; }
.tname { font-size: 19px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pct { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.mid { text-align: center; color: var(--text-2); font-size: 13px; line-height: 1.5; }
.split { display: flex; gap: 3px; height: 12px; margin-top: 16px; }
.split > div, .mini-split > div { border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.45); min-width: 2px; }
.score-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-top: 10px; }
.swap { font-size: 13px; padding: 4px 12px; white-space: nowrap; }
@media (max-width: 640px) {
  .score { gap: 6px; align-items: start; }
  .side { flex-wrap: wrap; gap: 4px 8px; }
  .side .pct { order: 3; flex-basis: 100%; font-size: 38px; }
  .side.b .pct { text-align: end; }
  .tname { font-size: 15px; }
  .kit { width: 14px; height: 14px; }
  .mid { padding-top: 2px; font-size: 12px; }
}
.warn { padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); font-size: 14px; margin-bottom: 16px; }
.stage { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.player { position: relative; background: #000; border-radius: 12px; overflow: hidden; cursor: pointer; }
.player video { display: block; width: 100%; height: auto; }
.player:fullscreen { display: flex; align-items: center; border-radius: 0; }
.player:fullscreen video { width: 100%; height: 100%; object-fit: contain; }
.player canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.icon-btn { width: 40px; height: 40px; padding: 0; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; font-variant-numeric: tabular-nums; }
.icon-btn svg { width: 18px; height: 18px; }
.clock { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.scrub { flex: 1; min-width: 60px; height: 36px; position: relative; cursor: pointer; touch-action: none; border-radius: 8px; }
.scrub svg { display: block; width: 100%; height: 100%; }
.player-note { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
.live { display: flex; flex-direction: column; gap: 18px; }
.live .label { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.now { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; line-height: 1.3; min-height: 32px; }
.now .muted { color: var(--text-3); }
.mini-split { display: flex; gap: 2px; height: 10px; margin: 6px 0 6px; }
.mini-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.mini-row span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 1000px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .metrics { grid-template-columns: minmax(0, 1fr); } }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.m-title { font-size: 14px; color: var(--text-2); margin-bottom: 8px; }
.m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 1.9; }
.m-row .m-name { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-row b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.m-one { font-size: 26px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.m-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; line-height: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; }
.chart svg { display: block; }
.chart svg text { fill: var(--text-3); font-size: 12px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.14); display: none; white-space: nowrap; z-index: 3; }
.tip .t-row { display: flex; align-items: center; gap: 6px; }
.chart svg text.row-label { fill: var(--text-2); font-size: 12.5px; font-weight: 500; }
.tip .tip-h { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.swatch { display: inline-block; width: 14px; height: 9px; border-radius: 2px; flex: none; }
.swatch.stop { background: var(--stop); }
.swatch.big { width: 18px; height: 18px; border-radius: 50%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.pitch-wrap { width: 100%; max-width: 760px; margin: 0 auto; }
.pitch-wrap canvas { display: block; width: 100%; }
.pitch-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--text-2); }
#pitch-metrics { margin-top: -4px; }
.chip-btn { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); border-color: var(--line); color: var(--text-2); }
.chip-btn.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.moments { max-height: 380px; overflow: auto; border-top: 1px solid var(--line); }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.mrow .mtime { font-size: 13px; padding: 3px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; flex: none; }
.mrow .mtext { flex: 1; min-width: 0; }
.mrow .mclip { width: 32px; height: 32px; }
.mrow .mclip svg { width: 16px; height: 16px; }
.mclip.busy { border-color: var(--accent); color: var(--accent); }
textarea.summary { width: 100%; min-height: 150px; font: inherit; font-size: 15px; line-height: 1.8; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; resize: vertical; }
textarea.summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.video-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; color: var(--text-2); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 7px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--text-2); font-weight: 500; }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--text-2); font-size: 14px; margin-top: 4px; }
.scroll { max-height: 340px; overflow: auto; margin-top: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.xg-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 4px 0 8px; }
.xg-team { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.xg-team b { font-size: 26px; font-variant-numeric: tabular-nums; }
.xg-team .sub2 { flex-basis: 100%; }
.mrow .sxg { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2em; }
.mrow.rejected { opacity: .45; }
.mrow .tog { font-size: 12px; padding: 3px 10px; }
#pitch.adding { cursor: crosshair; }
@media (max-width: 640px) { .xg-totals { grid-template-columns: 1fr; } }
.method p, .method li { color: var(--text-2); font-size: 14px; }
.method ul { padding-inline-start: 20px; margin: 10px 0; }
footer { color: var(--text-3); font-size: 13px; margin-top: 26px; line-height: 1.9; }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="28" r="15" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M24 21.5l6 4.4-2.3 7h-7.4l-2.3-7z" fill="currentColor"/><path d="M24 2.5l6.5 8.5h-13z" fill="var(--accent)"/></svg>
      <div><h1 data-t="title"></h1><p class="tagline" data-t="tagline"></p></div>
    </div>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <section class="card" id="setup">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*" class="sr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
      <strong data-t="dropTitle"></strong>
      <span class="hint" data-t="dropSub"></span>
      <span class="file-info" id="file-info"></span>
    </label>
    <div class="form">
      <fieldset><legend data-t="teamAField"></legend>
        <div class="team-row"><input type="text" id="nameA" dir="auto" autocomplete="off" data-tp="namePhA"><select id="colourA"></select></div>
      </fieldset>
      <fieldset><legend data-t="teamBField"></legend>
        <div class="team-row"><input type="text" id="nameB" dir="auto" autocomplete="off" data-tp="namePhB"><select id="colourB"></select></div>
      </fieldset>
      <div class="range">
        <label><span data-t="from"></span><input type="text" id="from" class="ltr" placeholder="0:00" autocomplete="off"></label>
        <label><span data-t="to"></span><input type="text" id="to" class="ltr" data-tp="toPh" autocomplete="off"></label>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="go" type="button" disabled data-t="analyse"></button>
      <button id="stop" type="button" hidden data-t="stop"></button>
    </div>
    <div class="progress-wrap" id="progress-wrap" hidden>
      <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <div class="status-row"><span id="status" aria-live="polite"></span><span class="chip" id="backend" hidden></span></div>
    </div>
    <p class="error" id="error" hidden></p>
    <p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-t="privacy"></span></p>
  </section>

  <section id="dash" hidden>
    <div class="card">
      <div class="score" id="score"></div>
      <div class="split" id="split" role="img"></div>
      <div class="score-foot"><span class="sub2" id="score-sub"></span><button class="swap" id="swap" type="button" data-t="swap"></button></div>
    </div>
    <div class="warn" id="warn" hidden></div>
    <div class="stage">
      <div class="card" style="padding: 14px;">
        <div class="player" id="player-box"><video id="player" playsinline preload="auto"></video><canvas id="overlay"></canvas></div>
        <div class="controls">
          <button class="icon-btn" id="play" type="button"></button>
          <span class="clock ltr" id="clock">0:00</span>
          <div class="scrub" id="scrub" role="slider" tabindex="0"></div>
          <button class="icon-btn" id="speed" type="button">1×</button>
          <button class="icon-btn" id="full" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
        </div>
        <p class="player-note" data-t="playerNote"></p>
      </div>
      <aside class="card live" id="live" aria-live="off"></aside>
    </div>
    <div class="card">
      <h2 data-t="timelineTitle"></h2>
      <p class="note" id="momentum-note"></p>
      <div class="legend" id="momentum-legend"></div>
      <div class="chart" id="momentum"></div>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="card" id="pitch-card" hidden>
      <h2 data-t="pitchTitle"></h2>
      <p class="note" id="pitch-off" hidden></p>
      <div id="pitch-body">
        <p class="note" data-t="pitchNote"></p>
        <div class="chips" id="pitch-chips" role="group"></div>
        <div class="pitch-wrap"><canvas id="pitch" role="img"></canvas></div>
        <p class="note" id="pitch-heat-note" hidden></p>
        <div class="pitch-foot"><span id="pitch-dir"></span><button id="pitch-flip" type="button" class="chip-btn" data-t="flipDir"></button></div>
      </div>
    </div>
    <div class="metrics" id="pitch-metrics" hidden></div>
    <div class="card" id="shots-card" hidden>
      <h2 data-t="shotsTitle"></h2>
      <p class="note" data-t="shotsNote"></p>
      <div class="xg-totals" id="xg-totals"></div>
      <div class="chart" id="xg-race"></div>
      <div class="toolbar"><button id="shot-add" type="button" data-t="shotAdd"></button><span class="note" id="shot-hint" aria-live="polite"></span></div>
      <div class="moments" id="shot-list"></div>
    </div>
    <div class="card">
      <h2 data-t="momentsTitle"></h2>
      <p class="note" data-t="momentsNote"></p>
      <div class="chips" id="moment-chips" role="group"></div>
      <div class="moments" id="moments"></div>
    </div>
    <div class="card">
      <h2 data-t="summaryTitle"></h2>
      <p class="note" data-t="summaryNote"></p>
      <textarea class="summary" id="summary-text" dir="auto" spellcheck="false"></textarea>
      <div class="toolbar"><button id="copy-summary" type="button" data-t="copy"></button></div>
    </div>
    <div class="card">
      <h2 data-t="spellsTitle"></h2>
      <details><summary data-t="spellsShow"></summary><div class="scroll"><table id="spells-table"></table></div></details>
    </div>
    <div class="card">
      <h2 data-t="saveTitle"></h2>
      <div class="toolbar">

  const REC_TYPES = ['video/mp4;codecs=avc1.42E01F,mp4a.40.2', 'video/mp4;codecs=avc1.42E01F', 'video/mp4',
                     'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  function recType() {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) return null;

  }

  let recording = null;
  async function recordVideo(a, b, name, btn) {
    if (recording || running || !R) return;
    const type = recType(); if (!type) return;
    const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm', status = $('video-status');
    const vid = document.createElement('video'); vid.preload = 'auto'; vid.playsInline = true; vid.src = videoURL;
    vid.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none';

    busy(true); status.hidden = false;
    try {
      await new Promise((res, rej) => { vid.addEventListener('loadeddata', res, {once: true}); vid.addEventListener('error', () => rej(new Error('read')), {once: true}); });
      const sc = Math.min(1, 1280 / vid.videoWidth), W = 2 * Math.round(vid.videoWidth * sc / 2), H = 2 * Math.round(vid.videoHeight * sc / 2);
      const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
      const tracks = c.captureStream(30).getVideoTracks();
      try {                                            // the sound goes to the file only, not to the speakers
        audio = new AudioContext(); const src = audio.createMediaElementSource(vid), dest = audio.createMediaStreamDestination();
        src.connect(dest); tracks.push(...dest.stream.getAudioTracks());
      } catch (e) { vid.muted = true; }
      const rec = new MediaRecorder(new MediaStream(tracks), {mimeType: type, videoBitsPerSecond: 5000000});
      const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const done = new Promise(res => { rec.onstop = res; });
      await new Promise(res => { vid.addEventListener('seeked', res, {once: true}); vid.currentTime = a; });
      const draw = () => { g.drawImage(vid, 0, 0, W, H); paintOverlay(g, W, H, 0, 0, W / vid.videoWidth, vid.currentTime, true); };

        vid.addEventListener('ended', finish, {once: true});            // no more frames come once the video ends
        const guard = setInterval(() => { if (recording.cancelled) finish(); }, 250);
        const tick = () => {
          if (finished) return;
          draw();
          status.textContent = t('videoProgress', iso(clockOf(Math.max(0, vid.currentTime - a))), iso(clockOf(b - a)));
          if (recording.cancelled || vid.currentTime >= endAt || vid.ended) { finish(); return; }
          if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(tick); else requestAnimationFrame(tick);
        };

      if (!recording.cancelled) { downloadBlob(name + '.' + ext, new Blob(chunks, {type: type.split(';')[0]})); status.textContent = t('videoDone'); }
      else status.textContent = '';

  }

        ...[0, 1].map(k => PZ && PZ.shapes[i] && PZ.shapes[i][k] && PZ.shapes[i][k].width != null ? PZ.shapes[i][k].width.toFixed(1) : ''),

  function roundRect(g, x, y, w, h, r, colour) {
    if (w <= 0 || h <= 0) return;
    r = Math.min(r, w / 2, h / 2);
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    g.fillStyle = colour; g.fill(); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.4)'; g.stroke();
  }
  function fitFont(g, text, weight, size, maxW) {
    for (let s = size; s >= 14; s -= 2) { g.font = weight + ' ' + s + 'px "IBM Plex Sans Arabic", system-ui, sans-serif'; if (g.measureText(text).width <= maxW) return; }
  }
  async function sharePng() {
    if (!R) return;
    const S = R.summary, M = S.metrics, W = 1200, H = 675, P = 64, isR = rtl();
    try { await Promise.all(['400 22px', '600 30px', '700 120px'].map(f => document.fonts.load(f + ' "IBM Plex Sans Arabic"'))); } catch (e) { /* system font then */ }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), fill = TC.fill, F = (w, s) => w + ' ' + s + 'px "IBM Plex Sans Arabic", system-ui, sans-serif';
    g.fillStyle = '#0c120e'; g.fillRect(0, 0, W, H);
    g.direction = isR ? 'rtl' : 'ltr'; g.textBaseline = 'alphabetic';
    const S0 = isR ? W - P : P, E0 = isR ? P : W - P, A = isR ? 'right' : 'left', Z = isR ? 'left' : 'right', toEnd = isR ? -1 : 1;
    g.textAlign = A; g.fillStyle = '#6fd497'; g.font = F(600, 28); g.fillText(t('title'), S0, 78);
    g.textAlign = Z; g.fillStyle = '#9aa69e'; g.font = F(400, 22); g.fillText(t('shareSub', clockOf(S.duration_seconds)), E0, 78);
    const dot = (x, y, k, r) => { g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fillStyle = fill[k]; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.4)'; g.stroke(); };
    dot(S0 + toEnd * 13, 158, 0, 13); g.fillStyle = '#ffffff'; g.textAlign = A; fitFont(g, teamLabel(0), 600, 34, W / 2 - 140); g.fillText(teamLabel(0), S0 + toEnd * 38, 170);
    dot(E0 - toEnd * 13, 158, 1, 13); g.fillStyle = '#ffffff'; g.textAlign = Z; fitFont(g, teamLabel(1), 600, 34, W / 2 - 140); g.fillText(teamLabel(1), E0 - toEnd * 38, 170);
    g.font = F(700, 128); g.fillStyle = '#ffffff'; g.textAlign = A; g.fillText(pct(S.teams[0].possession), S0, 300);
    g.textAlign = Z; g.fillText(pct(S.teams[1].possession), E0, 300);
    g.font = F(400, 22); g.fillStyle = '#9aa69e'; g.textAlign = 'center'; g.fillText(t('possession'), W / 2, 270);
    const bx = P, bw = W - 2 * P, aW = bw * S.teams[0].possession;
    roundRect(g, isR ? bx + bw - aW : bx, 326, Math.max(0, aW - 3), 16, 8, fill[0]);
    roundRect(g, isR ? bx : bx + aW + 3, 326, Math.max(0, bw - aW - 3), 16, 8, fill[1]);
    const mm = 452, mh = 54, bars = M.momentum.bars, slot = bw / Math.max(1, bars.length), w = Math.max(3, Math.min(26, slot * 0.7));

    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(bx, mm); g.lineTo(bx + bw, mm); g.stroke();
    bars.forEach((b, j) => {
      const cx = isR ? bx + bw - (j + 0.5) * slot : bx + (j + 0.5) * slot, h = Math.abs(b.value) * mh;
      if (h >= 1) roundRect(g, cx - w / 2, b.value > 0 ? mm - h : mm + 1, w, h, 3, b.value > 0 ? fill[0] : fill[1]);
    });
    const withShots = R.pitch && R.pitch.ok && R.shots && liveShots().length;   // expected goals, once there are shots
    const stats = [[t('mLosses'), M.ball_losses.map(String)], [t('mRegain'), M.quick_regains.map(String)],
                   withShots ? [t('xgShort'), shotTotals().map(o => o.xg.toFixed(2))] : [t('mSup'), M.superiority.share_more.map(v => v == null ? '–' : pct(v))]];
    stats.forEach(([label, vals], j) => {
      let x = S0 + toEnd * j * (bw / 3);
      g.textAlign = A; g.fillStyle = '#9aa69e'; g.font = F(400, 20); g.fillText(label, x, 564);
      g.font = F(600, 30);
      for (const k of [0, 1]) {
        dot(x + toEnd * 8, 594, k, 8); x += toEnd * 24;
        g.fillStyle = '#ffffff'; g.fillText(vals[k], x, 605); x += toEnd * (g.measureText(vals[k]).width + 30);
      }

    g.font = F(400, 18); g.fillStyle = '#6f7c73'; g.textAlign = A; g.fillText(t('shareFoot'), S0, 652);
    g.direction = 'ltr'; g.textAlign = isR ? 'left' : 'right'; g.fillText('huggingface.co/spaces/amreleraqi09/possession-from-video', E0, 652);
    c.toBlob(blob => { if (blob) downloadBlob('who-has-the-ball.png', blob); }, 'image/png');
  }
  $('dl-png').addEventListener('click', () => { sharePng(); });
  $('again').addEventListener('click', () => { $('setup').scrollIntoView({behavior: 'smooth', block: 'start'}); });
  $('swap').addEventListener('click', () => { if (!R) return; R.teams.names.reverse(); lastI = -1; renderDash(); });

  // ------------------------------------------------------------------ language
  function fillColourSelects() {
    for (const id of ['colourA', 'colourB']) {
      const sel = $(id), keep = sel.value; sel.replaceChildren(el('option', {value: ''}, t('colourAuto')));
      COLOUR_ORDER.forEach((w, i) => sel.append(el('option', {value: w}, t('colours')[i])));

  if (window.matchMedia) {

  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (R) { renderScrub(); renderTimeline(); renderPitch(currentIndex(player.currentTime || R.t0)); if (!$('shots-card').hidden && liveShots().length) renderXgRace(); syncTo(player.currentTime); } drawOverlay(); }, 150); });

  // ------------------------------------------------------------------ the run
  function findDuration(video) {
    if (isFinite(video.duration)) return Promise.resolve(video.duration);
    // Recordings saved straight from a browser or a phone can carry no length; jumping to the end makes the browser work it out.
    return new Promise(resolve => {
      const finish = () => { clearTimeout(timer); video.removeEventListener('durationchange', check); resolve(isFinite(video.duration) ? video.duration : NaN); };
      const check = () => { if (isFinite(video.duration)) finish(); };
      const timer = setTimeout(finish, 10000);
      video.addEventListener('durationchange', check);
      video.currentTime = 1e9;
    });
  }
  function setFile(f) {
    if (!f || running) return;
    showError('');
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(f); videoMeta = null; goBtn.disabled = true;
    $('file-info').textContent = t('reading', f.name);
    const probe = document.createElement('video'); probe.preload = 'metadata'; probe.muted = true; probe.src = videoURL;
    probe.addEventListener('loadedmetadata', async () => {
      const duration = await findDuration(probe);
      if (!(duration > 0)) { $('file-info').textContent = ''; showError(fail('errLength', f.name)); return; }
      videoMeta = {name: f.name, duration, width: probe.videoWidth, height: probe.videoHeight};
      showFileInfo(); goBtn.disabled = false;
    }, {once: true});
    probe.addEventListener('error', () => { $('file-info').textContent = ''; showError(fail('errRead')); }, {once: true});
  }
  fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); if (!running) drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setFile(f); });

  function buildGiven() {
    const names = [$('nameA').value.trim(), $('nameB').value.trim()], cols = [$('colourA').value || null, $('colourB').value || null];
    if (!names[0] && !names[1] && !cols[0] && !cols[1]) return {given: null, typed: false};
    const given = [0, 1].map(k => [names[k] || MARK + (cols[k] || '#' + (k + 1)), cols[k]]);
    return {given, typed: !!(names[0] || names[1])};
  }

  // A team the reader named keeps that name. With one colour given, that team goes to the closer kit.
  // A team with neither name nor colour is called after the colour of its kit.
  function nameTeams(teams, given) {
    if (!given) teams.names = [MARK + '#1', MARK + '#2'];
    else if (!given[0][1] !== !given[1][1]) {
      const k = given[0][1] ? 0 : 1, ref = stdLab(COLOUR_WORDS[given[k][1]]);
      const near = dist(stdLab(teams.colours[0]), ref) <= dist(stdLab(teams.colours[1]), ref) ? 0 : 1;
      teams.names = near === k ? [given[0][0], given[1][0]] : [given[1][0], given[0][0]];
    }
    const words = teams.colours.map(colourName);
    if (words[0] === words[1]) return;
    for (const k of [0, 1]) {
      const nm = teams.names[k];
      if ((nm === MARK + '#1' || nm === MARK + '#2') && teams.names[1 - k] !== MARK + words[k]) teams.names[k] = MARK + words[k];
    }
  }

  stopBtn.addEventListener('click', () => { cancelled = true; stopBtn.disabled = true; setStatus('stopping'); });

  goBtn.addEventListener('click', async () => {
    if (running || !videoMeta) return;
    if (recording) recording.cancelled = true;
    showError('');
    const {given, typed} = buildGiven();
    const t0 = parseClock($('from').value, 0), t1 = Math.min(videoMeta.duration, parseClock($('to').value, videoMeta.duration));
    if (!(t0 >= 0) || !(t1 > t0)) { showError(fail('errTimes')); return; }
    running = true; cancelled = false; goBtn.disabled = true; fileInput.disabled = true; stopBtn.hidden = false; stopBtn.disabled = false;
    $('backend').hidden = true; backendKey = null; setProgress(0, '');
    try {
      await loadModel();
      backendKey = backend === 'WebGPU' ? 'backendGPU' : 'backendCPU'; $('backend').textContent = t(backendKey); $('backend').hidden = false;
      const vid = document.createElement('video'); vid.muted = true; vid.preload = 'auto'; vid.src = videoURL;
      await new Promise((res, rej) => { vid.addEventListener('loadeddata', res, {once: true}); vid.addEventListener('error', () => rej(fail('errRead')), {once: true}); });
      const samples = await detectAll(vid, t0, t1, (k, n, tt, left) => {
        setProgress(0.1 + 0.88 * k / n, t('frameStatus', count(k), count(n), iso(clockOf(tt)), left < 90 ? t('nSec', Math.round(left)) : t('nMin', Math.round(left / 60))));
      });
      vid.removeAttribute('src'); vid.load();
      if (samples.length < 10) throw fail(cancelled ? 'errStoppedEarly' : 'errShort');
      setProgress(0.99, t('teamsStep'));
      await new Promise(r => setTimeout(r, 30));
      let teams;
      try { teams = fitTeams(samples, given); }
      catch (e) { throw /Too few players/.test(e.message) ? fail('errFew') : /look alike/.test(e.message) ? fail('errSame') : e; }
      for (const s of samples) for (const p of s.people) p.team = teams.assign(p.colour);
      nameTeams(teams, given);
      const {pos, source} = cleanBall(samples, videoMeta.width);
      const {proba, states: rawStates} = possession(samples, pos);
      const X = analyseMore(samples, rawStates, pos, source), states = X.states;     // stoppages are nobody's possession
      const summary = summarise(samples, states, source, teams, videoMeta.name, videoMeta);
      X.moments = moments(summary.spells, X.regains, X.presses, X.stops, states, samples.map(s => s.t));
      summary.metrics = extraMetrics(samples, states, pos, source, summary, X);
      mapPitch(samples);
      const pitch = pitchAnalysis(samples, states, false, summary.spells);
      summary.metrics.pitch = pitchMetrics(pitch);
      for (const m of sequenceMoments(pitch)) X.moments.push(m);
      const shots = pitch.ok ? findShots(samples, states, pitch.dir.dirA) : [];
      X.moments.sort((a, b) => a.t - b.t || a.kind.localeCompare(b.kind));
      const cum = []; let ca = 0, cb = 0; states.forEach(s => { if (s === TEAM_A) ca++; else if (s === TEAM_B) cb++; cum.push([ca, cb]); });
      R = {samples, states, rawStates, proba, ball: pos, source, teams, summary, cum, losses: cumulativeLosses(states),
           stopped: X.stopped, stops: X.stops, around: X.around, act: X.act, pitch, flip: false, shots,
           t0: samples[0].t, t1: samples[samples.length - 1].t + 1 / HZ, customNames: typed, kitDisplay: teams.colours.map(displayColour)};
      summaryEdited = false; momentFilter = 'top'; pitchMode = 'live'; addingShot = false;
      summary.metrics.shots = shotMetrics();
      window.__summary = summary; window.__result = R;
      lastI = -1;
      player.addEventListener('loadedmetadata', () => { player.currentTime = R.t0; syncTo(R.t0); drawOverlay(); }, {once: true});
      player.src = videoURL;
      renderDash();
      setProgress(1); setStatus(cancelled ? 'stoppedEarly' : 'doneStatus');
      $('dash').scrollIntoView({behavior: 'smooth', block: 'start'});

    } catch (e) {
      console.error(e); showError(e); setStatus(null); $('progress-wrap').hidden = true; window.__done = 'error';
    } finally {

  applyLang();
})();
